name: proyecto-eve

services:
  database:
    image: mcr.microsoft.com/mssql/server:2025-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
      MSSQL_MEMORY_LIMIT_MB: 4096
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backups
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Core/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=database,1433;Database=AZESHERBD;User Id=azesher_app;Password=${DB_APP_PASSWORD};Encrypt=True;TrustServerCertificate=True
      JwtSettings__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      JwtSettings__Issuer: CoreApi
      JwtSettings__Audience: CoreFrontend
      FrontendBaseUrl: https://sistema.azesher.com
      Digifact__Enabled: ${DIGIFACT_ENABLED:-false}
      Digifact__Environment: ${DIGIFACT_ENVIRONMENT:-Test}
      Digifact__BaseUrl: ${DIGIFACT_BASE_URL:-https://testnucgt.digifact.com/api/}
      Digifact__TaxId: ${DIGIFACT_TAX_ID:-}
      Digifact__Username: ${DIGIFACT_USERNAME:-}
      Digifact__Password: ${DIGIFACT_PASSWORD:-}
      Smtp__Enabled: ${SMTP_ENABLED:-false}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__From: ${SMTP_FROM:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-Aze-Sher}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - data-protection:/home/app/.aspnet/DataProtection-Keys
    networks:
      - backend
      - edge

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_PUBLIC_APP_URL: https://sistema.azesher.com
    restart: unless-stopped
    networks:
      - edge

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - api
    networks:
      - edge

volumes:
  sqlserver-data:
  caddy-data:
  caddy-config:
  data-protection:

networks:
  backend:
    internal: true
  edge:
